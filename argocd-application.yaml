apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Mehmet-ocal/todo-kubernetes.git
    targetRevision: main
    path: todo-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
