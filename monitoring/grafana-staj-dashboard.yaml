apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-staj-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  staj-kubernetes-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "title": "Master Node",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{node=\"master-node\",condition=\"Ready\",status=\"true\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP"
                    },
                    "0": {
                      "text": "DOWN"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Worker Node",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{node=\"worker-node\",condition=\"Ready\",status=\"true\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP"
                    },
                    "0": {
                      "text": "DOWN"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Deployment CPU Kullanımı",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (workload) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",image!=\"\"}[5m]) * on(namespace,pod) group_left(workload,workload_type) namespace_workload_pod:kube_pod_owner:relabel{namespace=\"$namespace\",workload_type=\"deployment\"})",
              "legendFormat": "{{workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Deployment RAM Kullanımı",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (workload) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",image!=\"\"} * on(namespace,pod) group_left(workload,workload_type) namespace_workload_pod:kube_pod_owner:relabel{namespace=\"$namespace\",workload_type=\"deployment\"})",
              "legendFormat": "{{workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": [
        "staj",
        "kubernetes"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Staj - Kubernetes Cluster Dashboard",
      "uid": "staj-kubernetes-cluster",
      "version": 1
    }
