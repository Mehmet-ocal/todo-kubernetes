dbConfig:
  host: "mysql-service"
  user: "root"
  name: "tododb"
backend:
  image:
    repository: "ocaltubitak/todo-kube-backend"
    tag: "04c8ccd"
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetMemoryUtilizationPercentage: 70
frontend:
  image:
    repository: "ocaltubitak/todo-kube-frontend"
    tag: "04c8ccd"
